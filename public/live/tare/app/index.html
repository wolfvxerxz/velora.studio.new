<style>:root { --ink: #0F110F; --ink-2: #141714; --ink-3: #1A1E1A; --ink-4: #212621; --line: #1D211D; --line-2: #2A2F2A; --paper: #E9EAE5; --mute: #9AA097; --dim: #6F776D; --faint: #454B44; --mint: #45E39F; --mint-2: #63EBB1; --green: #1D5E43; --green-2: #2E8A63; --deep: #0E2219; --ease: cubic-bezier(0.23, 1, 0.32, 1); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--ink); color: var(--paper); font-family: "Inter Tight", system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
ul, ol { list-style: none; }
h1, h2, h3 { font-weight: 500; text-wrap: balance; }
p { text-wrap: pretty; }
::selection { background: var(--green); color: var(--mint); }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

/* shell */
.a-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.a-side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px 18px; background: var(--ink); box-shadow: inset -1px 0 0 var(--line); }
.a-lock { display: inline-flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 19px; font-weight: 600; }
.a-lock svg { width: 18px; height: 18px; color: var(--mint); }
.a-ws, .a-me { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--ink-2); font-size: 13px; color: var(--mute); line-height: 1.3; }
.a-ws i, .a-me i { width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: var(--deep); color: var(--mint); font-style: normal; font-weight: 600; font-size: 14px; }
.a-ws span, .a-me span { display: flex; flex-direction: column; min-width: 0; }
.a-ws b, .a-me b { color: var(--paper); font-weight: 500; font-size: 14px; }
.a-acct { position: relative; margin-top: auto; }
.a-me { width: 100%; background: transparent; text-align: left; transition: background-color 160ms ease; }
.a-me:hover, .a-me[aria-expanded="true"] { background: var(--ink-2); }
.a-me em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-chev { width: 12px; height: 12px; margin-left: auto; flex: none; fill: none; stroke: var(--dim); stroke-width: 1.5; transition: transform 200ms var(--ease); }
.a-me[aria-expanded="true"] .a-chev { transform: rotate(180deg); }
.a-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 40; padding: 6px; background: var(--ink-3); box-shadow: 0 16px 40px -12px #000; transform-origin: bottom left; animation: a-pop 160ms var(--ease) both; }
.a-menu[hidden] { display: none; }
@keyframes a-pop { from { opacity: 0; transform: scale(0.97) translateY(4px); } }
.a-menu-h { display: flex; flex-direction: column; padding: 8px 10px 10px; font-size: 13px; color: var(--mute); line-height: 1.35; }
.a-menu-h b { color: var(--paper); font-weight: 500; font-size: 14px; }
.a-menu a, .a-menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; font-size: 14px; color: var(--paper); text-align: left; transition: background-color 120ms ease; }
.a-menu a:hover, .a-menu button:hover, .a-menu a:focus-visible, .a-menu button:focus-visible { background: var(--ink-4); outline: none; }
.a-menu svg { width: 16px; height: 16px; fill: none; stroke: var(--mute); stroke-width: 1.5; flex: none; }
.a-menu button[data-act="signout"] { margin-top: 6px; color: var(--mute); }

/* profile */
.a-prof { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.a-prof .a-card { display: flex; flex-direction: column; gap: 14px; }
.a-prof .a-card h3 { margin-bottom: 0; }
.a-ava { display: flex; align-items: center; gap: 16px; }
.a-ava i { width: 64px; height: 64px; display: grid; place-items: center; background: var(--deep); color: var(--mint); font-style: normal; font-weight: 600; font-size: 26px; }
.a-ava span { display: flex; flex-direction: column; font-size: 13.5px; color: var(--mute); } .a-ava b { color: var(--paper); font-weight: 500; font-size: 17px; }
.a-acc { display: flex; flex-direction: column; gap: 2px; }
.a-acc li { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 52px; padding: 8px 12px; background: var(--ink-3); font-size: 14px; }
.a-acc li > span { display: flex; align-items: center; gap: 10px; min-width: 0; }
.a-acc li > span svg { width: 16px; height: 16px; flex: none; color: var(--mute); }
.a-acc li > span em { font-style: normal; color: var(--dim); font-size: 13px; }
.a-acc li > span span { display: flex; flex-direction: column; line-height: 1.3; }
.a-acc .a-btn { height: 32px; padding: 0 12px; font-size: 13.5px; }
.a-now { color: var(--mint); font-size: 13px; }

/* signed out */
.a-out { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background-color: var(--ink); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 32px 32px; background-position: center; }
.a-out-box { width: 100%; max-width: 400px; padding: 36px 32px 28px; background: var(--ink-2); animation: a-in 420ms var(--ease) both; }
.a-out-box > svg { width: 34px; height: 34px; color: var(--mint); }

.a-out-box > p { margin-top: 6px; color: var(--mute); font-size: 14.5px; }

.a-out-box .a-btn svg { width: 16px; height: 16px; }

.a-nav { display: flex; flex-direction: column; gap: 2px; }
.a-nav a { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; font-size: 14.5px; color: var(--mute); transition: background-color 160ms ease, color 160ms ease; }
.a-nav a svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; flex: none; }
.a-nav a:hover { color: var(--paper); background: var(--ink-2); }
.a-nav a.on { color: var(--paper); background: var(--ink-3); }
.a-nav a.on svg { color: var(--mint); }
.a-cap { padding: 14px 10px 0; font-size: 13px; color: var(--mute); }
.a-cap b { color: var(--paper); font-weight: 500; }
.a-cap div { margin-top: 8px; height: 4px; background: var(--line-2); }
.a-cap div i { display: block; height: 100%; background: var(--mint); transition: width 600ms var(--ease); }

.a-main { min-width: 0; padding: 36px 40px 80px; outline: none; }
.a-page { max-width: 1180px; margin: 0 auto; animation: a-in 420ms var(--ease) both; }
@keyframes a-in { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .a-page, .a-stag > * { animation: none !important; } }
.a-stag > * { animation: a-in 460ms var(--ease) both; }
.a-stag > *:nth-child(2) { animation-delay: 40ms; } .a-stag > *:nth-child(3) { animation-delay: 80ms; } .a-stag > *:nth-child(4) { animation-delay: 120ms; } .a-stag > *:nth-child(5) { animation-delay: 160ms; } .a-stag > *:nth-child(6) { animation-delay: 200ms; } .a-stag > *:nth-child(n+7) { animation-delay: 240ms; }

.a-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.a-top h1 { font-size: 30px; line-height: 1.15; }
.a-top p { margin-top: 6px; color: var(--mute); max-width: 60ch; }
.a-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 14px; color: var(--mute); }
.a-back:hover { color: var(--paper); }

/* buttons */
.a-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; background: var(--mint); color: #08130D; font-size: 14.5px; font-weight: 500; white-space: nowrap; transition: transform 160ms var(--ease), background-color 200ms ease, color 200ms ease, box-shadow 200ms ease; }
.a-btn:hover { background: var(--mint-2); }
.a-btn:active { transform: scale(0.97); }
.a-btn.line { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--line-2); }
.a-btn.line:hover { box-shadow: inset 0 0 0 1px var(--dim); }
.a-btn.quiet { background: var(--ink-3); color: var(--paper); }
.a-btn.quiet:hover { background: var(--ink-4); }
.a-btn.big { height: 48px; padding: 0 22px; font-size: 15.5px; }
.a-btn[disabled] { background: var(--ink-3); color: var(--dim); cursor: not-allowed; transform: none; }

/* status pills */
.a-pill { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; font-size: 13px; background: var(--ink-3); color: var(--mute); white-space: nowrap; }
.a-pill i { width: 7px; height: 7px; background: var(--dim); flex: none; }
.a-pill.run { color: var(--paper); } .a-pill.run i { background: var(--mint); animation: a-blink 1.2s ease-in-out infinite; }
.a-pill.review { background: var(--deep); color: var(--mint); } .a-pill.review i { background: var(--mint); }
.a-pill.merged { color: var(--paper); } .a-pill.merged i { background: var(--green-2); }
.a-pill.none i, .a-pill.closed i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dim); }
@keyframes a-blink { 50% { background: var(--green); } }

/* stats */
.a-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 28px; }
.a-stats div { background: var(--ink-2); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.a-stats span { font-size: 13px; color: var(--mute); }
.a-stats b { font-size: 30px; font-weight: 500; line-height: 1; }
.a-stats b.m { color: var(--mint); }
.a-stats em { font-style: normal; font-size: 13px; color: var(--dim); }

/* task table */
.a-filter { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.a-filter button { height: 32px; padding: 0 12px; font-size: 13.5px; color: var(--mute); background: transparent; transition: background-color 160ms ease, color 160ms ease; }
.a-filter button.on { background: var(--ink-3); color: var(--paper); }
.a-filter button:hover { color: var(--paper); }
.a-tasks { display: flex; flex-direction: column; gap: 2px; }
.a-task { display: grid; grid-template-columns: 1fr 160px 150px 110px 90px; gap: 20px; align-items: center; min-height: 64px; padding: 12px 18px; background: var(--ink-2); transition: background-color 160ms ease; }
.a-task:hover { background: var(--ink-3); }
.a-task .t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.a-task .t b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-task .t span { font-size: 13px; color: var(--dim); display: flex; gap: 10px; align-items: center; white-space: nowrap; overflow: hidden; }
.a-task .t span svg { width: 12px; height: 12px; flex: none; }
.a-task .r { font-size: 13.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-task .c { text-align: right; font-size: 14px; color: var(--mute); }
.a-task .c.m { color: var(--mint); }
.a-task .mini { display: flex; gap: 3px; align-items: center; }
.a-task .mini i { width: 12px; height: 4px; background: var(--line-2); }
.a-task .mini i.d { background: var(--faint); } .a-task .mini i.w { background: var(--mint); }
.a-head-row { display: grid; grid-template-columns: 1fr 160px 150px 110px 90px; gap: 20px; padding: 0 18px 8px; font-size: 12.5px; color: var(--dim); }
.a-head-row span:last-child { text-align: right; }
.a-empty { padding: 48px 20px; background: var(--ink-2); text-align: center; color: var(--mute); }

/* new task */
.a-new { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
.a-step { background: var(--ink-2); padding: 24px; margin-bottom: 12px; }
.a-step h2 { font-size: 18px; }
.a-step > p { margin-top: 4px; font-size: 14px; color: var(--mute); }
.a-step-body { margin-top: 18px; }
.a-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.a-choice { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--ink-3); text-align: left; transition: background-color 160ms ease, box-shadow 160ms ease; }
.a-choice:hover { background: var(--ink-4); }
.a-choice b { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.a-choice b svg { width: 14px; height: 14px; color: var(--mute); }
.a-choice span { font-size: 13px; color: var(--dim); }
.a-choice.on { background: var(--deep); box-shadow: inset 0 0 0 1px var(--green-2); }
.a-choice.on b svg { color: var(--mint); }
.a-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--ink-3); margin-bottom: 14px; }
.a-tabs button { height: 32px; padding: 0 14px; font-size: 13.5px; color: var(--mute); transition: background-color 160ms ease, color 160ms ease; display: inline-flex; align-items: center; gap: 8px; }
.a-tabs button svg { width: 13px; height: 13px; }
.a-tabs button.on { background: var(--ink-4); color: var(--paper); }
.a-issues { display: flex; flex-direction: column; gap: 2px; }
.a-issue { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center; height: 48px; padding: 0 14px; background: var(--ink-3); text-align: left; transition: background-color 160ms ease, box-shadow 160ms ease; }
.a-issue:hover { background: var(--ink-4); }
.a-issue span { font-size: 13px; color: var(--dim); }
.a-issue b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-issue em { font-style: normal; font-size: 13px; color: var(--dim); }
.a-issue.on { background: var(--deep); box-shadow: inset 0 0 0 1px var(--green-2); }
.a-issue.on span { color: var(--mint); }
.a-field { display: flex; flex-direction: column; gap: 8px; }
.a-field label { font-size: 13px; color: var(--mute); }
.a-field input, .a-field textarea { width: 100%; padding: 12px 14px; background: var(--ink-3); border: 0; outline: none; font-size: 15px; transition: box-shadow 160ms ease; }
.a-field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.a-field input:focus, .a-field textarea:focus { box-shadow: inset 0 0 0 1px var(--green-2); }
.a-field input::placeholder, .a-field textarea::placeholder { color: var(--dim); }
.a-models { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.a-model { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; background: var(--ink-3); text-align: left; transition: background-color 160ms ease; }
.a-model:hover { background: var(--ink-4); }
.a-model i { width: 16px; height: 16px; flex: none; box-shadow: inset 0 0 0 1.5px var(--dim); display: grid; place-items: center; transition: background-color 160ms ease, box-shadow 160ms ease; }
.a-model i svg { width: 10px; height: 10px; opacity: 0; transition: opacity 160ms ease; }
.a-model.on i { background: var(--mint); box-shadow: none; } .a-model.on i svg { opacity: 1; color: #08130D; }
.a-model span { font-size: 12.5px; color: var(--dim); margin-left: auto; }
.a-checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.a-sw { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 10px 14px; background: var(--ink-3); text-align: left; }
.a-sw span { display: flex; flex-direction: column; line-height: 1.35; }
.a-sw span b { font-weight: 500; } .a-sw span em { font-style: normal; font-size: 13px; color: var(--dim); }
.a-sw i { position: relative; width: 34px; height: 20px; flex: none; background: var(--line-2); transition: background-color 200ms ease; }
.a-sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; background: var(--mute); transition: transform 220ms var(--ease), background-color 200ms ease; }
.a-sw.on i { background: var(--green); } .a-sw.on i::after { transform: translateX(14px); background: var(--mint); }
.a-sum { position: sticky; top: 36px; background: var(--ink-2); padding: 24px; }
.a-sum h2 { font-size: 18px; }
.a-sum dl { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.a-sum dl div { display: flex; justify-content: space-between; gap: 16px; }
.a-sum dt { color: var(--mute); } .a-sum dd { text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.a-sum .a-price { margin-top: 22px; padding: 16px; background: var(--deep); }
.a-sum .a-price b { display: block; font-size: 24px; font-weight: 500; color: var(--mint); }

/* run */
.a-runhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 22px; }

.a-clock span { display: block; font-size: 13px; color: var(--mute); font-weight: 400; }
.a-run { display: grid; grid-template-columns: 1fr 380px; gap: 12px; align-items: start; }
.a-lanes { background: var(--ink-2); padding: 8px; }

.a-lane-cols { padding: 10px 12px; font-size: 12.5px; color: var(--dim); }

.a-lane:hover { background: var(--ink-3); }
.a-lane.sel { background: var(--ink-3); box-shadow: inset 2px 0 0 var(--mint); }
.a-lane .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-lane .tr { height: 6px; background: var(--line); overflow: hidden; }

.a-lane .ck { display: flex; gap: 5px; }

.a-lane .df, .a-lane .co { color: var(--mute); }
.a-lane .st { color: var(--mute); white-space: nowrap; }
.a-lane.fail .st { color: var(--dim); }
.a-lane.win { background: var(--deep); } .a-lane.win .tr i { background: var(--mint); } .a-lane.win .st, .a-lane.win .co { color: var(--mint); }
.a-lane.lose .nm, .a-lane.lose .df { color: var(--dim); } .a-lane.lose .tr i { background: var(--faint); } .a-lane.lose .ck i.ok { background: var(--green); } .a-lane.lose .co { color: var(--dim); text-decoration: line-through; }
.a-detail { background: var(--ink-2); padding: 22px; min-height: 100%; }
.a-detail h3 { font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.a-detail > p { margin-top: 4px; font-size: 13.5px; color: var(--mute); }
.a-log { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.a-log li { display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; align-items: start; font-size: 14px; color: var(--dim); }

.a-log li em { font-style: normal; font-size: 12.5px; color: var(--dim); }
.a-log li.done { color: var(--paper); } .a-log li.done i { background: var(--green-2); box-shadow: none; }
.a-log li.now { color: var(--paper); } .a-log li.now i { background: var(--mint); box-shadow: none; animation: a-blink 1.2s ease-in-out infinite; }
.a-log li.bad { color: var(--mute); } .a-log li.bad i { box-shadow: inset 0 0 0 1.5px var(--mute); }
.a-ckrows { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 13.5px; }
.a-ckrow { display: flex; align-items: center; gap: 10px; color: var(--mute); }

/* review */
.a-rev { display: grid; grid-template-columns: 1fr 360px; gap: 12px; align-items: start; }
.a-files { display: flex; flex-direction: column; gap: 12px; }

.a-file-h span { color: var(--mute); flex: none; } .a-file-h span em { font-style: normal; color: var(--mint); }
.a-diff { padding: 8px 0; font-size: 13.5px; line-height: 1.75; overflow-x: auto; }

.a-diff div s { text-decoration: none; color: var(--dim); text-align: center; user-select: none; }

.a-why li .ck { display: flex; gap: 3px; } .a-why li .ck i { width: 9px; height: 9px; background: var(--green); } .a-why li .ck i.no { background: transparent; box-shadow: inset 0 0 0 1.2px var(--faint); }
.a-why li em { font-style: normal; text-align: right; }

.a-risk { font-size: 14px; color: var(--mute); } .a-risk b { color: var(--paper); font-weight: 500; }
.a-merge b { display: block; font-size: 28px; font-weight: 500; color: var(--mint); line-height: 1; }
.a-merge span { display: block; margin-top: 8px; font-size: 13px; color: var(--mute); }
.a-merge .a-btn { width: 100%; margin-top: 18px; }

.a-merge.done b { color: var(--paper); }

/* billing */

/* repos & settings */
.a-repos { display: flex; flex-direction: column; gap: 2px; }
.a-repo { display: grid; grid-template-columns: 1fr 110px 120px 140px 110px; gap: 16px; align-items: center; min-height: 64px; padding: 10px 18px; background: var(--ink-2); font-size: 14px; }
.a-repo .n { display: flex; align-items: center; gap: 12px; min-width: 0; } .a-repo .n svg { width: 18px; height: 18px; flex: none; color: var(--mute); }
.a-repo .n span { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; } .a-repo .n b { font-weight: 500; } .a-repo .n em { font-style: normal; font-size: 13px; color: var(--dim); }
.a-repo > span { color: var(--mute); }
.a-repo .ok { color: var(--mint); text-align: right; }
.a-connect { margin-top: 12px; background: var(--ink-2); padding: 20px; }
.a-connect h3 { font-size: 15px; } .a-connect p { margin-top: 4px; font-size: 13.5px; color: var(--mute); }
.a-connect ul { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
.a-connect li { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 50px; padding: 0 14px; background: var(--ink-3); font-size: 14px; }
.a-connect li span { display: flex; align-items: center; gap: 10px; } .a-connect li svg { width: 16px; height: 16px; color: var(--mute); }
.a-set { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.a-set .a-card { display: flex; flex-direction: column; gap: 6px; }
.a-set .a-card > p { font-size: 13.5px; color: var(--mute); margin: -8px 0 8px; }

/* toast */
.a-toast { position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 12px; max-width: 420px; padding: 14px 18px; background: var(--ink-4); color: var(--paper); font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 200ms ease, transform 300ms var(--ease); }
.a-toast.on { opacity: 1; transform: none; }
.a-toast i { width: 8px; height: 8px; background: var(--mint); flex: none; }

/* tablet */
@media (max-width: 1180px) {
  .a-run, .a-rev, .a-new, .a-bill { grid-template-columns: 1fr; }

}

}
@media (max-width: 640px) {
  .a-top { flex-direction: column; align-items: flex-start; gap: 16px; }

  .a-head-row { display: none; }

  .a-stats b { font-size: 24px; }

  .a-issue { grid-template-columns: 64px 1fr; } .a-issue em { display: none; }
  .a-step { padding: 18px 16px; }

  .a-clock { text-align: left; }

  .a-lane { grid-template-columns: 1fr 92px; grid-template-rows: auto auto; height: auto; padding: 12px; row-gap: 10px; }
  .a-lane .nm { grid-column: 1; grid-row: 1; } .a-lane .st { grid-column: 2; grid-row: 1; text-align: right; }
  .a-lane .tr { grid-column: 1; grid-row: 2; } .a-lane .ck { grid-column: 2; grid-row: 2; justify-content: flex-end; }
  .a-lane .df, .a-lane .co { display: none; }
  .a-verdict { flex-direction: column; align-items: flex-start; }
  .a-ckrows { grid-template-columns: 1fr; }

}
/* phones: the nav scrolls on its own, the avatar stays pinned at the right */
@media (max-width: 900px) {
  .a-side { overflow: visible; }
  .a-nav { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .a-nav::-webkit-scrollbar { display: none; }

}
@media (max-width: 900px) { .a-shell { grid-template-columns: minmax(0, 1fr); } .a-side { min-width: 0; } }

/* ---------- sign in / sign up ---------- */
.a-auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }

@keyframes a-turn { to { transform: rotate(360deg); } }
.a-auth-r { position: relative; display: grid; place-items: center; padding: 48px; overflow: hidden; background-color: var(--ink-2);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 32px 32px; background-position: center; }
.a-auth-r::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 45%, transparent 30%, var(--ink-2) 90%); }

.a-demo { padding: 18px; background: var(--ink); }

.a-demo-row > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--paper); }

.a-demo-row em { display: flex; gap: 4px; } .a-demo-row em i { width: 11px; height: 11px; background: var(--line); }
.a-demo-row em i.ok { background: var(--mint); } .a-demo-row em i.no { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dim); }

.a-demo-row.lose > span { color: var(--dim); } .a-demo-row.lose b i { background: var(--faint); } .a-demo-row.lose em i.ok { background: var(--green); }

.a-onb-cap input { width: 100%; accent-color: var(--mint); margin-top: 8px; }

<script>/* Tare console: start a task, watch six attempts, review the winner, merge and pay. All local, no backend. */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)]
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]))
const money = (n) => "$" + n.toFixed(2)
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches
const tick = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2 4 7.5 8.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
const ic = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`

const MODELS = [
  { id: "opus", nm: "Claude Opus", note: "Strongest" }, { id: "sonnet", nm: "Claude Sonnet", note: "Fast" }, { id: "gpt", nm: "GPT", note: "Broad" },
  { id: "gemini", nm: "Gemini", note: "Long context" }, { id: "mistral", nm: "Mistral", note: "Lean" }, { id: "qwen", nm: "Qwen Coder", note: "Open" },
]
const CHECKS = [["tests", "Tests", "Your test suite"], ["types", "Types", "Type checker, no new errors"], ["lint", "Lint", "Your lint config"], ["scope", "Scope", "Only the folders the issue names"]]
const REPOS = [
  { id: "checkout-web", lang: "TypeScript", tests: 412, scope: "checkout/", added: "Connected Oct 2" },
  { id: "api", lang: "Go", tests: 1180, scope: "billing/", added: "Connected Oct 2" },
  { id: "mobile", lang: "Swift", tests: 236, scope: "Receipts/", added: "Connected Oct 9" },
]
const MORE_REPOS = [{ id: "web-admin", lang: "TypeScript", tests: 318, scope: "admin/" }, { id: "infra", lang: "HCL", tests: 42, scope: "modules/" }]

/* issues from Linear, each with the diff its winning attempt makes */
const ISSUES = [
  { id: "LIN-482", repo: "checkout-web", title: "Fix the flaky checkout retry test", risk: "Low. Touches retry timing only, behind the existing flag.",
    files: [
      { f: "checkout/retry.ts", lines: [["gap", "@@ export function scheduleRetry(attempt: number) @@"], [" ", "  const base = RETRY_BASE_MS"], ["-", "  const delay = base * 2 ** attempt + Math.random() * 250"], ["-", "  return setTimeout(run, delay)"], ["+", "  const delay = base * 2 ** attempt + jitter(attempt)"], ["+", "  return clock.setTimeout(run, delay)"], [" ", "}"], ["gap", "@@ const jitter @@"], ["+", "const jitter = (attempt: number) => (attempt * 37) % 250"]] },
      { f: "checkout/retry.test.ts", lines: [["gap", "@@ describe(\"scheduleRetry\") @@"], ["-", "  await sleep(1200)"], ["+", "  const clock = fakeClock()"], ["+", "  scheduleRetry(2, { clock })"], ["+", "  clock.advance(RETRY_BASE_MS * 4 + 74)"], [" ", "  expect(run).toHaveBeenCalledTimes(1)"]] },
      { f: "lib/clock.ts", lines: [["+", "export const clock = { setTimeout: globalThis.setTimeout.bind(globalThis) }"], ["+", "export type Clock = typeof clock"]] },
    ] },
  { id: "LIN-479", repo: "api", title: "Add idempotency keys to refunds", risk: "Medium. New column on refunds, migration is additive.",
    files: [
      { f: "billing/refund.go", lines: [["gap", "@@ func (s *Service) Refund(ctx context.Context, r RefundRequest) @@"], ["+", "\tif r.IdempotencyKey == \"\" {"], ["+", "\t\treturn nil, ErrMissingKey"], ["+", "\t}"], ["+", "\tif prev, ok := s.store.RefundByKey(ctx, r.IdempotencyKey); ok {"], ["+", "\t\treturn prev, nil"], ["+", "\t}"], [" ", "\trefund, err := s.psp.Refund(ctx, r.ChargeID, r.Amount)"]] },
      { f: "billing/migrations/0042_refund_keys.sql", lines: [["+", "ALTER TABLE refunds ADD COLUMN idempotency_key text;"], ["+", "CREATE UNIQUE INDEX refunds_idem ON refunds (idempotency_key);"]] },
    ] },
  { id: "LIN-475", repo: "mobile", title: "Dark mode for the receipt screen", risk: "Low. Colours only, no layout changes.",
    files: [{ f: "Receipts/ReceiptView.swift", lines: [["gap", "@@ var body: some View @@"], ["-", "      .background(Color.white)"], ["-", "      .foregroundStyle(.black)"], ["+", "      .background(Color(.systemBackground))"], ["+", "      .foregroundStyle(.primary)"], [" ", "      .padding(24)"]] }] },
  { id: "LIN-471", repo: "checkout-web", title: "Debounce address autocomplete", risk: "Low. One component, covered by existing tests.",
    files: [{ f: "checkout/AddressField.tsx", lines: [["gap", "@@ export function AddressField() @@"], ["-", "  useEffect(() => { suggest(query) }, [query])"], ["+", "  const debounced = useDebounced(query, 180)"], ["+", "  useEffect(() => { if (debounced.length > 2) suggest(debounced) }, [debounced])"]] },
      { f: "checkout/useDebounced.ts", lines: [["+", "export function useDebounced<T>(value: T, ms: number) {"], ["+", "  const [v, set] = useState(value)"], ["+", "  useEffect(() => { const t = setTimeout(() => set(value), ms); return () => clearTimeout(t) }, [value, ms])"], ["+", "  return v"], ["+", "}"]] }] },
  { id: "LIN-468", repo: "api", title: "Paginate the orders export", risk: "Low. The export endpoint keeps its old shape for page one.",
    files: [{ f: "billing/export.go", lines: [["gap", "@@ func (h *Handler) ExportOrders(w http.ResponseWriter, r *http.Request) @@"], ["-", "\torders, err := h.store.AllOrders(r.Context())"], ["+", "\tcursor := r.URL.Query().Get(\"cursor\")"], ["+", "\torders, next, err := h.store.OrdersPage(r.Context(), cursor, 500)"], ["+", "\tw.Header().Set(\"X-Next-Cursor\", next)"]] }] },
  { id: "LIN-466", repo: "checkout-web", title: "Remove the legacy coupon path", risk: "",
    files: [] },
]
const issueOf = (id) => ISSUES.find((i) => i.id === id)

/* deterministic attempts per task */
const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
const rngOf = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
const CK_GAP = 0.45
function attemptsOf(task) {
  const rnd = rngOf(hash(task.id)), iss = issueOf(task.issue), forceNone = !iss || !iss.files.length
  const list = task.models.map((m, i) => {
    const dur = 4 + rnd() * 5, at = 0.2 + rnd() * 0.8, add = 12 + Math.round(rnd() * 90), del = 2 + Math.round(rnd() * 30)
    const ck = CHECKS.map(([k]) => !task.checks[k] || forceNone ? (task.checks[k] ? rnd() > 0.55 : null) : rnd() > 0.28)
    if (forceNone && ck.every((c) => c !== false)) ck[0] = false
    return { m: MODELS.find((x) => x.id === m).nm, dur, at, add, del, ck, cost: 1.1 + rnd() * 1.4, tests: Math.round(18 + rnd() * 40) }
  })
  if (!forceNone) { const w = Math.floor(rnd() * list.length); list[w].ck = list[w].ck.map((c) => (c === null ? null : true)) }
  const pass = (a) => a.ck.every((c) => c !== false)
  let win = -1; list.forEach((a, i) => { if (pass(a) && (win < 0 || a.add + a.del < list[win].add + list[win].del)) win = i })
  if (win >= 0 && iss) { const add = iss.files.reduce((s, f) => s + f.lines.filter((l) => l[0] === "+").length, 0), del = iss.files.reduce((s, f) => s + f.lines.filter((l) => l[0] === "-").length, 0); list[win].add = add; list[win].del = del; list.forEach((a, i) => { if (i !== win && pass(a) && a.add + a.del <= list[win].add + list[win].del) a.add = list[win].add + 8 + i * 5 }) }
  const end = (a) => a.at + a.dur + CK_GAP * 4
  return { list, win, decideAt: Math.max(...list.map(end)) + 0.6 }
}

/* ---------- state ---------- */
const KEY = "tare-console-v1", now = () => Date.now(), H = 3600e3
const seed = () => ({
  cap: 200,
  repos: REPOS.map((r) => r.id),
  defaults: { models: MODELS.map((m) => m.id), checks: { tests: true, types: true, lint: true, scope: true } },
  notify: { slack: true, linear: true, email: false },
  me: { name: "Vuk", email: "vuk@halden.dev", role: "Head of engineering" },
  accounts: { github: true, linear: true, slack: true },
  sessions: [{ id: "s1", dev: "MacBook Pro", app: "Chrome", where: "Belgrade", seen: "Active now", me: true }, { id: "s2", dev: "iPhone", app: "Safari", where: "Belgrade", seen: "2 days ago" }, { id: "s3", dev: "Linux", app: "Firefox", where: "Novi Sad", seen: "9 days ago" }],
  out: false,
  seq: 1290,
  tasks: [
    { id: "T-1288", issue: "LIN-468", models: MODELS.map((m) => m.id), checks: { tests: true, types: true, lint: true, scope: true }, started: now() - 0.6 * H, status: "review" },
    { id: "T-1284", issue: "LIN-482", models: MODELS.map((m) => m.id), checks: { tests: true, types: true, lint: true, scope: true }, started: now() - 26 * H, status: "merged", merged: now() - 25 * H },
    { id: "T-1281", issue: "LIN-475", models: MODELS.map((m) => m.id), checks: { tests: true, types: true, lint: true, scope: true }, started: now() - 50 * H, status: "merged", merged: now() - 49 * H },
    { id: "T-1279", issue: "LIN-466", models: MODELS.map((m) => m.id), checks: { tests: true, types: true, lint: true, scope: true }, started: now() - 74 * H, status: "none" },
    { id: "T-1276", issue: "LIN-479", models: ["opus", "sonnet", "gpt", "gemini"], checks: { tests: true, types: true, lint: true, scope: true }, started: now() - 98 * H, status: "merged", merged: now() - 97 * H },
  ],
})
let S
try { S = JSON.parse(localStorage.getItem(KEY)) } catch { S = null }
if (!S || !S.tasks) { S = seed(); S.out = true; S.fresh = true }
if (!S.me) { const f = seed(); S.me = f.me; S.accounts = f.accounts; S.sessions = f.sessions; S.out = false }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch {} }
const taskOf = (id) => S.tasks.find((t) => t.id === id)
const elapsed = (t) => (now() - t.started) / 1000
function settle(t) { /* a running task becomes review or none once its run is over */
  if (t.status !== "running") return
  const A = attemptsOf(t); if (elapsed(t) >= A.decideAt) { t.status = A.win >= 0 ? "review" : "none"; save() }
}
const billedOf = (t) => { if (t.status !== "merged") return 0; const A = attemptsOf(t); return A.win >= 0 ? A.list[A.win].cost : 0 }
const wastedOf = (t) => { const A = attemptsOf(t); return A.list.reduce((s, a, i) => s + (t.status === "merged" && i === A.win ? 0 : a.cost), 0) }
const weekTasks = () => S.tasks.filter((t) => now() - t.started < 7 * 24 * H)
const spentWeek = () => weekTasks().reduce((s, t) => s + billedOf(t), 0)

/* ---------- toast ---------- */
let toastT = 0
function toast(msg) { const el = $(".a-toast"); el.innerHTML = `<i></i><span>${msg}</span>`; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 3600) }

/* ---------- views ---------- */
const STATUS = { running: ["run", "Running"], review: ["review", "Ready to review"], merged: ["merged", "Merged"], none: ["none", "No winner"], closed: ["closed", "Closed"] }
const pill = (st) => `<span class="a-pill ${STATUS[st][0]}"><i></i>${STATUS[st][1]}</span>`
const ago = (ms) => { const m = Math.round((now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago` }
const href = (t) => (t.status === "running" ? `#/run/${t.id}` : t.status === "review" || t.status === "merged" ? `#/review/${t.id}` : `#/run/${t.id}`)

function viewTasks(filter = "all") {
  S.tasks.forEach(settle)
  const run = S.tasks.filter((t) => t.status === "running").length, rev = S.tasks.filter((t) => t.status === "review").length
  const merged = weekTasks().filter((t) => t.status === "merged"), spent = spentWeek(), saved = weekTasks().reduce((s, t) => s + wastedOf(t), 0)
  const list = S.tasks.filter((t) => filter === "all" || (filter === "open" ? ["running", "review"].includes(t.status) : t.status === filter)).sort((a, b) => b.started - a.started)
  const row = (t) => {

    const mini = A.list.map((a, k) => `<i class="${t.status === "merged" || t.status === "review" ? (k === A.win ? "w" : "d") : t.status === "running" ? "" : "d"}"></i>`).join("")
    const cost = t.status === "merged" ? `<span class="c m">${money(billedOf(t))}</span>` : `<span class="c">${t.status === "none" ? "$0.00" : "Not billed"}</span>`
    return `<a class="a-task" href="${href(t)}"><span class="t"><b>${esc(i.title)}</b><span>${ic("linear")}${i.id} · ${t.id} · ${ago(t.started)}</span></span><span class="r">halden/${i.repo}</span><span class="p">${pill(t.status)}</span><span class="mini" aria-hidden="true">${mini}</span>${cost}</a>`
  }
  return `<div class="a-page">
    <div class="a-top"><div><h1>Tasks</h1><p>Every issue you hand to Tare, with the attempt that won and what it cost.</p></div><a class="a-btn" href="#/new">New task</a></div>
    <div class="a-stats a-stag">
      <div><span>Running</span><b>${run}</b><em>${run ? "Six attempts each" : "Nothing in flight"}</em></div>
      <div><span>Ready to review</span><b class="${rev ? "m" : ""}">${rev}</b><em>One pull request each</em></div>
      <div><span>Merged this week</span><b>${merged.length}</b><em>${merged.length} of ${weekTasks().length} tasks</em></div>
      <div><span>Billed this week</span><b>${money(spent)}</b><em>${money(saved)} of attempts not billed</em></div>
    </div>
    <div class="a-filter" role="tablist">${[["all", "All"], ["open", "Open"], ["merged", "Merged"], ["none", "No winner"]].map(([k, l]) => `<button class="${k === filter ? "on" : ""}" data-filter="${k}">${l}</button>`).join("")}</div>
    <div class="a-head-row" aria-hidden="true"><span>Task</span><span class="r">Repository</span><span>Status</span><span class="mn">Attempts</span><span>Cost</span></div>
    <div class="a-tasks a-stag">${list.length ? list.map(row).join("") : (S.tasks.length ? `<div class="a-empty">No tasks here yet.</div>` : `<div class="a-empty a-empty-first"><b>No tasks yet</b><p>Hand Tare an issue and six agents take it on. You review one pull request.</p><a class="a-btn" href="#/new">Start your first task</a></div>`)}</div>
  </div>`
}

/* new task: a draft lives in memory until started */
let D = null
const freshDraft = () => ({ repo: "checkout-web", source: "linear", issue: "LIN-471", text: "", models: [...S.defaults.models], checks: { ...S.defaults.checks } })
function viewNew() {
  if (!D) D = freshDraft()
  const repos = REPOS.concat(MORE_REPOS).filter((r) => S.repos.includes(r.id))
  const issues = ISSUES.filter((i) => i.repo === D.repo && i.files.length && !S.tasks.some((t) => t.issue === i.id && ["running", "review", "merged"].includes(t.status)))
  if (D.source === "linear" && !issues.some((i) => i.id === D.issue)) D.issue = issues[0] ? issues[0].id : null
  const repo = repos.find((r) => r.id === D.repo) || repos[0]
  const ready = D.models.length > 0 && (D.source === "linear" ? !!D.issue : D.text.trim().length > 6)
  const title = D.source === "linear" ? (D.issue ? issueOf(D.issue).title : "Pick an issue") : D.text.trim() || "Describe the task"
  const lo = 1.1 + 0.1 * D.models.length, hi = 2.1 + 0.05 * D.models.length
  return `<div class="a-page">
    <a class="a-back" href="#/">← Tasks</a>
    <div class="a-top"><div><h1>New task</h1><p>Pick a repository and an issue. Tare runs every agent you choose on it, checks each attempt, and opens one pull request.</p></div></div>
    <div class="a-new">
      <div class="a-stag">
        <section class="a-step"><h2>Repository</h2><p>Where the agents work. Each attempt gets its own sandbox.</p>
          <div class="a-step-body a-choices">${repos.map((r) => `<button class="a-choice ${r.id === D.repo ? "on" : ""}" data-repo="${r.id}" aria-pressed="${r.id === D.repo}"><b>${ic("github")}halden/${r.id}</b><span>${r.lang} · ${r.tests.toLocaleString()} tests</span></button>`).join("")}</div>
        </section>
        <section class="a-step"><h2>Task</h2><p>Take an issue from Linear, or write one.</p>
          <div class="a-step-body">
            <div class="a-tabs" role="tablist"><button class="${D.source === "linear" ? "on" : ""}" data-source="linear">${ic("linear")}From Linear</button><button class="${D.source === "text" ? "on" : ""}" data-source="text">Write one</button></div>
            ${D.source === "linear"
              ? `<div class="a-issues">${issues.length ? issues.map((i) => `<button class="a-issue ${i.id === D.issue ? "on" : ""}" data-issue="${i.id}" aria-pressed="${i.id === D.issue}"><span>${i.id}</span><b>${esc(i.title)}</b><em>Backlog</em></button>`).join("") : `<div class="a-empty">No open issues for this repository. Write one instead.</div>`}</div>`
              : `<div class="a-field"><label for="a-text">What should change?</label><textarea id="a-text" data-text placeholder="Make the order confirmation email include the delivery window">${esc(D.text)}</textarea></div>`}
          </div>
        </section>
        <section class="a-step"><h2>Agents</h2><p>Each one makes its own attempt. More agents, better odds, same price per merge.</p>
          <div class="a-step-body a-models">${MODELS.map((m) => `<button class="a-model ${D.models.includes(m.id) ? "on" : ""}" data-model="${m.id}" aria-pressed="${D.models.includes(m.id)}"><i>${tick}</i>${m.nm}<span>${m.note}</span></button>`).join("")}</div>
        </section>
        <section class="a-step"><h2>Checks</h2><p>Every attempt has to pass these before you see it.</p>
          <div class="a-step-body a-checks">${CHECKS.map(([k, l, d]) => `<button class="a-sw ${D.checks[k] ? "on" : ""}" data-check="${k}" role="switch" aria-checked="${!!D.checks[k]}"><span><b>${l}</b><em>${k === "scope" ? `Only ${repo ? repo.scope : "the named folders"}` : d}</em></span><i></i></button>`).join("")}</div>
        </section>
      </div>
      <aside class="a-sum">
        <h2>Summary</h2>
        <dl>
          <div><dt>Task</dt><dd>${esc(title)}</dd></div>
          <div><dt>Repository</dt><dd>halden/${repo ? repo.id : ""}</dd></div>
          <div><dt>Attempts</dt><dd>${D.models.length} in parallel</dd></div>
          <div><dt>Checks</dt><dd>${CHECKS.filter(([k]) => D.checks[k]).map(([, l]) => l).join(", ") || "None"}</dd></div>
          <div><dt>Weekly cap</dt><dd>${money(spentWeek())} of ${money(S.cap)}</dd></div>
        </dl>
        <div class="a-price"><b>${money(lo)} to ${money(hi)}</b><span>Typical price for a change like this, charged only if you merge it.</span></div>
        <button class="a-btn big" data-act="start" ${ready ? "" : "disabled"}>Start task</button>
        <small>Attempts you don't merge are never billed.</small>
      </aside>
    </div>
  </div>`
}

function startTask() {
  let issue = D.issue
  if (D.source === "text") { /* a written task becomes a Linear issue on the spot */
    const n = 484 + S.tasks.filter((t) => t.issue.startsWith("LIN-4")).length, id = `LIN-${n}`
    if (!issueOf(id)) ISSUES.push({ id, repo: D.repo, title: D.text.trim().replace(/\.$/, ""), risk: "Low. Small change in one area.", files: [{ f: `${(REPOS.concat(MORE_REPOS).find((r) => r.id === D.repo) || REPOS[0]).scope}change.ts`, lines: [["gap", "@@ the change you described @@"], ["+", "// " + D.text.trim().slice(0, 80)], ["+", "export const enabled = true"]] }] })
    issue = id; S.custom = (S.custom || []).concat([issueOf(id)])
  }
  const id = "T-" + ++S.seq
  S.tasks.unshift({ id, issue, models: [...D.models], checks: { ...D.checks }, started: now(), status: "running" })
  save(); D = null; location.hash = `#/run/${id}`
}

/* run */
let runSel = 0
function viewRun(id) {
  const t = taskOf(id); if (!t) return viewMissing()
  settle(t)
  const i = issueOf(t.issue), A = attemptsOf(t)
  if (runSel >= A.list.length) runSel = 0
  return `<div class="a-page" data-run="${t.id}">
    <a class="a-back" href="#/">← Tasks</a>
    <div class="a-runhead">
      <div><h1>${esc(i.title)}</h1><div class="a-meta"><span>${ic("linear")}${i.id}</span><span>${ic("github")}halden/${i.repo}</span><span>${t.id}</span><span data-r-state>${pill(t.status)}</span></div></div>
      <div class="a-clock"><b data-r-clock>00:00</b><span>${A.list.length} attempts</span></div>
    </div>
    <div class="a-run">
      <div class="a-lanes">
        <div class="a-lane-cols" aria-hidden="true"><span>Agent</span><span>Work</span><span>Checks</span><span>Diff</span><span>Cost</span><span>Status</span></div>
        ${A.list.map((a, k) => `<button class="a-lane ${k === runSel ? "sel" : ""}" data-lane="${k}"><span class="nm">${a.m}</span><span class="tr"><i></i></span><span class="ck">${a.ck.map(() => "<i></i>").join("")}</span><span class="df">–</span><span class="co">$0.00</span><span class="st">Queued</span></button>`).join("")}
      </div>
      <div class="a-detail" data-r-detail></div>
    </div>
    <div data-r-verdict></div>
  </div>`
}
const STEPS = (a, i) => [["Read the issue and the files it names", 0], [`Read ${8 + (a.tests % 9)} related files`, 0.12], ["Planned the change", 0.3], [`Wrote a patch, ${i.files.length || 1} file${(i.files.length || 1) > 1 ? "s" : ""}`, 0.55], ["Ran the patch locally", 0.82]]
function runFrame() {
  const root = $("[data-run]"); if (!root) return
  const t = taskOf(root.dataset.run); if (!t) return
  const i = issueOf(t.issue), A = attemptsOf(t), e = t.status === "running" ? elapsed(t) : A.decideAt + 1
  const decided = e >= A.decideAt
  if (decided && t.status === "running") { settle(t); $("[data-r-state]").innerHTML = pill(t.status); if (t.status === "review") toast(`${A.list[A.win].m} won. The pull request is ready to review.`) }
  const shown = Math.min(e, A.decideAt), s = Math.floor(shown)
  $("[data-r-clock]").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
  const lanes = $$(".a-lane", root)
  A.list.forEach((a, k) => {
    const L = lanes[k], p = Math.max(0, Math.min(1, (e - a.at) / a.dur)), done = p >= 1, ct = done ? Math.min(4, Math.floor((e - a.at - a.dur) / CK_GAP) + 1) : 0
    const pass = a.ck.every((c) => c !== false)
    L.querySelector(".tr i").style.transform = `scaleX(${(1 - Math.pow(1 - p, 2.2)).toFixed(4)})`
    L.querySelectorAll(".ck i").forEach((c, j) => { c.className = a.ck[j] === null ? "" : j < ct ? (a.ck[j] ? "ok" : "no") : "" })
    L.querySelector(".df").textContent = done ? `+${a.add} −${a.del}` : p > 0 ? "…" : "–"
    L.querySelector(".co").textContent = money(a.cost * Math.min(1, p))
    const st = decided ? (k === A.win ? "Merged pick" : "Not billed") : p <= 0 ? "Queued" : !done ? "Writing" : ct < 4 ? "Checking" : pass ? "Passed" : "Failed"
    L.querySelector(".st").textContent = st === "Merged pick" ? (t.status === "merged" ? "Merged" : "Winner") : st
    L.classList.toggle("fail", !decided && done && ct >= 4 && !pass)
    L.classList.toggle("win", decided && k === A.win); L.classList.toggle("lose", decided && k !== A.win)
  })
  /* detail of the selected attempt */
  const a = A.list[runSel], p = Math.max(0, Math.min(1, (e - a.at) / a.dur)), done = p >= 1, ct = done ? Math.min(4, Math.floor((e - a.at - a.dur) / CK_GAP) + 1) : 0
  const steps = STEPS(a, i), key = `${runSel}|${steps.filter(([, at]) => p >= at).length}|${ct}|${decided}`
  const det = $("[data-r-detail]")
  if (det.dataset.key !== key) {
    det.dataset.key = key
    const pass = a.ck.every((c) => c !== false)
    det.innerHTML = `<h3>${a.m}<span class="a-pill ${decided && runSel === A.win ? "review" : ""}"><i></i>${decided ? (runSel === A.win ? "Winner" : "Not billed") : !done ? (p > 0 ? "Writing" : "Queued") : ct < 4 ? "Checking" : pass ? "Passed" : "Failed"}</span></h3>
      <p>Attempt ${runSel + 1} of ${A.list.length}, in its own sandbox</p>
      <ol class="a-log">${steps.map(([s, at], j) => { const next = steps[j + 1] ? steps[j + 1][1] : 1, cls = p >= next || (done && j === steps.length - 1) ? "done" : p >= at ? "now" : ""; return `<li class="${cls}"><i></i><span>${s}</span><em>${cls ? (a.at + a.dur * at).toFixed(1) + "s" : ""}</em></li>` }).join("")}
        ${done ? CHECKS.map(([k, l], j) => a.ck[j] === null ? "" : j < ct ? `<li class="${a.ck[j] ? "done" : "bad"}"><i></i><span>${l} ${a.ck[j] ? "passed" : "failed"}${k === "tests" && a.ck[j] ? `, ${(REPOS.concat(MORE_REPOS).find((r) => r.id === i.repo) || REPOS[0]).tests} of ${(REPOS.concat(MORE_REPOS).find((r) => r.id === i.repo) || REPOS[0]).tests}` : k === "tests" ? `, ${a.tests % 7 + 1} failing` : k === "scope" && !a.ck[j] ? ", touched files outside the issue" : ""}</span><em></em></li>` : j === ct ? `<li class="now"><i></i><span>Running ${l.toLowerCase()}</span><em></em></li>` : "").join("") : ""}</ol>
      <div class="a-ckrows">${CHECKS.map(([, l], j) => a.ck[j] === null ? `<span class="a-ckrow"><i></i>${l} off</span>` : `<span class="a-ckrow ${j < ct && a.ck[j] ? "ok" : ""}"><i class="${j < ct ? (a.ck[j] ? "ok" : "no") : ""}"></i>${l}</span>`).join("")}</div>`
  }
  /* verdict */
  const v = $("[data-r-verdict]"), vk = decided ? t.status : "pending"
  if (v.dataset.key !== vk) {
    v.dataset.key = vk
    if (!decided) v.innerHTML = `<div class="a-pending">Attempts finish in under a minute. Leave this page anytime, the run keeps going.</div>`
    else if (A.win >= 0) { const w = A.list[A.win], lost = A.list.reduce((s, x, k) => s + (k === A.win ? 0 : x.cost), 0)
      v.innerHTML = `<div class="a-verdict"><p>${w.m} won with every check passed and the smallest diff, +${w.add} −${w.del}. <span>${A.list.length - 1} attempts, ${money(lost)} of tokens, not billed.</span></p><div class="acts"><a class="a-btn" href="#/review/${t.id}">${t.status === "merged" ? "View pull request" : "Review pull request"}</a></div></div>` }
    else v.innerHTML = `<div class="a-verdict none"><p>No attempt passed every check. <span>Nothing was billed.</span></p><div class="acts"><button class="a-btn line" data-act="retry" data-id="${t.id}">Run again</button></div></div>`
  }
}

/* review */
function viewReview(id) {
  const t = taskOf(id); if (!t) return viewMissing()
  settle(t); if (t.status === "running") return viewRun(id)
  const i = issueOf(t.issue), A = attemptsOf(t)
  if (A.win < 0) return viewRun(id)
  const w = A.list[A.win], pr = 1200 + parseInt(t.id.slice(2), 10) % 100, merged = t.status === "merged", closed = t.status === "closed"
  const files = i.files.map((f) => { let n = 12 + (hash(f.f) % 40); const add = f.lines.filter((l) => l[0] === "+").length, del = f.lines.filter((l) => l[0] === "-").length
    return `<section class="a-file"><div class="a-file-h"><b>${esc(f.f)}</b><span><em>+${add}</em> −${del}</span></div><div class="a-diff">${f.lines.map(([k, s]) => k === "gap" ? `<div class="gap">${esc(s)}</div>` : `<div class="${k === "+" ? "add" : k === "-" ? "del" : ""}"><u>${k === "-" ? "" : ++n}</u><s>${k === " " ? "" : k === "+" ? "+" : "−"}</s>${esc(s)}</div>`).join("")}</div></section>` }).join("")
  const lost = A.list.reduce((s, x, k) => s + (k === A.win ? 0 : x.cost), 0)
  return `<div class="a-page">
    <a class="a-back" href="#/run/${t.id}">← Run</a>
    <div class="a-runhead"><div><h1>${esc(i.title)}</h1><div class="a-meta"><span>${merged ? pill("merged") : closed ? pill("closed") : pill("review")}</span><span>#${pr}</span><span>${ic("github")}halden/${i.repo}</span><span>tare/${i.id.toLowerCase()} into main</span><span>Attempt ${A.win + 1} of ${A.list.length}, ${w.m}</span></div></div></div>
    <div class="a-rev">
      <div class="a-files a-stag">${files}</div>
      <div class="a-side-col">
        <div class="a-card a-merge ${merged ? "done" : ""}">
          ${merged ? `<b>${money(w.cost)}</b><span>Billed when it merged ${ago(t.merged)}. ${money(lost)} of other attempts not billed.</span><button class="a-btn line" data-act="revert" data-id="${t.id}">Revert</button>`
          : closed ? `<b>$0.00</b><span>Closed without merging. Nothing billed.</span><button class="a-btn" data-act="reopen" data-id="${t.id}">Reopen</button>`
          : `<b>${money(w.cost)}</b><span>Charged when you merge. ${money(lost)} of other attempts won't be.</span><button class="a-btn big" data-act="merge" data-id="${t.id}">Approve and merge</button><button class="a-btn quiet" data-act="close" data-id="${t.id}">Close without merging</button>`}
        </div>
        <div class="a-card"><h3>Checks</h3><div class="a-ckrows" style="margin-top:0">${CHECKS.map(([k, l], j) => w.ck[j] === null ? `<span class="a-ckrow"><i></i>${l} off</span>` : `<span class="a-ckrow ok"><i class="ok"></i>${l}${k === "tests" ? `, ${(REPOS.concat(MORE_REPOS).find((r) => r.id === i.repo) || REPOS[0]).tests} passed` : ""}</span>`).join("")}</div></div>
        <div class="a-card"><h3>Why this attempt</h3><ul class="a-why">${A.list.map((a, k) => `<li class="${k === A.win ? "w" : ""}"><span>${a.m}</span><span class="ck">${a.ck.map((c) => `<i class="${c === false ? "no" : ""}"></i>`).join("")}</span><em>+${a.add} −${a.del}</em></li>`).join("")}</ul></div>
        <div class="a-card"><h3>Risk</h3><p class="a-risk"><b>${esc(i.risk.split(".")[0])}.</b>${esc(i.risk.slice(i.risk.indexOf(".") + 1))}</p></div>
      </div>
    </div>
  </div>`
}

function viewBilling() {
  const merged = S.tasks.filter((t) => t.status === "merged").sort((a, b) => b.merged - a.merged)
  const total = merged.reduce((s, t) => s + billedOf(t), 0), wasted = S.tasks.reduce((s, t) => s + wastedOf(t), 0), wk = spentWeek()
  const day = (ms) => new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short" })
  return `<div class="a-page">
    <div class="a-top"><div><h1>Billing</h1><p>You pay for merged changes. Everything else Tare tried is on us.</p></div></div>
    <div class="a-stats a-stag">
      <div><span>Billed this month</span><b>${money(total)}</b><em>${merged.length} merged changes</em></div>
      <div><span>Not billed</span><b class="m">${money(wasted)}</b><em>Attempts you didn't merge</em></div>
      <div><span>Average per change</span><b>${money(merged.length ? total / merged.length : 0)}</b><em>Across all repositories</em></div>
      <div><span>This week</span><b>${money(wk)}</b><em>of a ${money(S.cap)} cap</em></div>
    </div>
    <div class="a-bill">
      <ul class="a-rows a-stag"><li class="h"><span>Date</span><span>Change</span><span>Repository</span><span>Agent</span><em>Price</em></li>
        ${merged.map((t) => { const i = issueOf(t.issue), A = attemptsOf(t); return `<li><span>${day(t.merged)}</span><b>${esc(i.title)}</b><span>halden/${i.repo}</span><span>${A.list[A.win].m}</span><em>${money(billedOf(t))}</em></li>` }).join("") || `<li><span></span><b>No merged changes yet</b></li>`}
      </ul>
      <div class="a-card">
        <h3>Weekly cap</h3>
        <div class="a-big" data-capv>${money(S.cap)}</div>

/* the right panel: a quiet loop of a run */
let demoT0 = 0, demoRaf = 0
function demoLoop() {
  cancelAnimationFrame(demoRaf)
  const el = $("[data-demo]"); if (!el) return
  const rows = $$(".a-demo-row", el), foot = $("[data-demo-foot]"), spec = [[3.4, 1, 1, 1, 1], [4.6, 1, 1, 0, 1], [3.9, 0, 1, 1, 1], [5.2, 1, 0, 1, 1], [2.8, 0, 1, 0, 1], [4.2, 1, 1, 1, 0]], WIN = 0, LOOP = 10
  demoT0 = performance.now()
  const frame = (now) => {
    const t = REDUCED ? 8 : ((now - demoT0) / 1000) % LOOP, decided = t > 7.4
    rows.forEach((r, k) => {
      const [d, ...ck] = spec[k], p = Math.min(1, t / d), n = p < 1 ? 0 : Math.min(4, Math.floor((t - d) / 0.35) + 1)
      r.querySelector("b i").style.transform = `scaleX(${(1 - Math.pow(1 - p, 2)).toFixed(3)})`
      r.querySelectorAll("em i").forEach((c, j) => (c.className = j < n ? (ck[j] ? "ok" : "no") : ""))
      r.querySelector("s").textContent = decided ? (k === WIN ? "Merged" : "Not billed") : p < 1 ? "Writing" : n < 4 ? "Checking" : ck.every(Boolean) ? "Passed" : "Failed"
      r.classList.toggle("win", decided && k === WIN); r.classList.toggle("lose", decided && k !== WIN)
    })
    foot.textContent = decided ? "Billed $1.84 for the merge. Five attempts not billed." : "Six attempts on one issue"
    if (!REDUCED) demoRaf = requestAnimationFrame(frame)
  }
  demoRaf = requestAnimationFrame(frame)
}

function onbClick(d, el) {

  if (d.onbrepo) { o.repos = o.repos.includes(d.onbrepo) ? o.repos.filter((r) => r !== d.onbrepo) : [...o.repos, d.onbrepo]; save(); render(); return true }
  if (d.onbtog) { o[d.onbtog] = !o[d.onbtog]; save(); render(); return true }
  if (d.onbmodel) { o.models = o.models.includes(d.onbmodel) ? o.models.filter((m) => m !== d.onbmodel) : MODELS.map((m) => m.id).filter((m) => m === d.onbmodel || o.models.includes(m)); save(); render(); return true }
  switch (d.act) {

    case "auth-back": A.step = "start"; A.err = ""; render(); return true
